[package]
name = "noise-tunnel-rs"
version = "0.1.0"
edition = "2021"
authors = ["Kevinmat <kevin_mata98@hotmail.com>"]
description = "A memory-safe, asynchronous E2EE secure session tunnel in Rust using Noise Protocol concepts (X25519, HKDF-SHA256, ChaCha20-Poly1305)"
license = "MIT OR Apache-2.0"

[dependencies]
# Cryptography
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
chacha20poly1305 = { version = "0.10.1", features = ["alloc"] }
hkdf = "0.12.4"
sha2 = "0.10.8"
rand_core = { version = "0.6.4", features = ["std"] }
rand = "0.8.5"
zeroize = { version = "1.8.1", features = ["zeroize_derive"] }

# Asynchronous Network & I/O
tokio = { version = "1.38.0", features = ["full"] }
tokio-util = { version = "0.7.11", features = ["codec"] }
bytes = "1.6.0"

# CLI & Formatting
clap = { version = "4.5.8", features = ["derive"] }
hex = "0.4.3"
anyhow = "1.0.86"
thiserror = "1.0.61"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
